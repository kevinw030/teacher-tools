# Keeps the page copies (games.html, timer.html, ...) in step with index.html,
# so clean addresses like edsidekick.com/games always show the latest site.
name: Make page copies
on:
  push:
    branches: [main]
    paths: ['index.html', 'assets/app.js', 'tools/**', 'scripts/make-pages.js']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: make-pages
  cancel-in-progress: false
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/make-pages.js
      - name: Save any changes
        run: |
          git add -A -- '*.html'
          if git diff --cached --quiet; then echo "Page copies already up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update page copies from index.html"
          for i in 1 2 3 4; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((i*5)); done
          exit 1
